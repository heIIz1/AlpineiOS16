name: WindowsiOS
options:
  bundleIdPrefix: local.alpineios
  deploymentTarget:
    iOS: "16.1"
  xcodeVersion: "16.0"

packages:
  SwiftTerm:
    path: ../ThirdParty/SwiftTerm

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    IPHONEOS_DEPLOYMENT_TARGET: "16.1"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ALPINE_IMAGE_MANIFEST_URL: https://github.com/Lumid-Off/AlpineiOS-images/releases/download/phosh-26.06-r1/phosh.json

targets:
  WindowsiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
          - "Resources/**"
      - path: Sources/Resources/Brand.xcassets
        buildPhase: resources
      - path: ../scripts/guest/update_guest_tools.sh
        buildPhase: resources
      - path: ../ThirdParty/GraphicsLicenses
        type: folder
        buildPhase: resources
      - path: deps/Resources
        buildPhase: resources
      - path: Sources/Resources/henge-jit.js
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: AlpineiOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AlpineImageManifestURL: $(ALPINE_IMAGE_MANIFEST_URL)
        NSLocalNetworkUsageDescription: "Download a Phosh image from a server on your local network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: File to send to Linux
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.data
        CADisableMinimumFrameDurationOnPhone: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: WindowsiOS.entitlements
      properties:
        get-task-allow: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.alpineios.app
        PRODUCT_NAME: WindowsiOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.2.1
        CURRENT_PROJECT_VERSION: 3
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: $(PROJECT_DIR)/Sources/Native/WindowsiOS-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../core
          - $(PROJECT_DIR)/../host
          - $(PROJECT_DIR)/../devices
          - $(PROJECT_DIR)/deps/include
          - $(PROJECT_DIR)/Sources/Native
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../build/ios
          - $(PROJECT_DIR)/deps/lib
        OTHER_LDFLAGS:
          - $(inherited)
          - -lwinvm
          - -lslirp
          - -lglib-2.0
          - -lintl
          - -lpcre2-8
          - -lffi
          - -lresolv
          - -liconv
    dependencies:
      - framework: deps/Frameworks/vulkan.1.framework
        embed: true
        link: false
      - framework: deps/Frameworks/epoxy.0.framework
        embed: true
        link: false
      - framework: deps/Frameworks/GLESv2.framework
        embed: true
        link: false
      - framework: deps/Frameworks/EGL.framework
        embed: true
        link: false
      - framework: deps/Frameworks/virglrenderer.1.framework
        embed: true
        link: false
      - package: SwiftTerm
      - sdk: AVFoundation.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreGraphics.framework
      - sdk: ImageIO.framework
      - sdk: UniformTypeIdentifiers.framework
